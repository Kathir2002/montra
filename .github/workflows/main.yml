name: 'Build Android APK'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
        
      - name: Grant execute permission to Gradlew
        run: chmod +x android/gradlew

      - name: Decode Keystore from Base64
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/montra.keystore

      - name: Verify keystore location
        run: |
          ls -la android/app/
          echo "Working directory: $(pwd)"

      - name: Update gradle.properties
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=app/montra.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}" >> android/gradle.properties

      - name: Build Signed APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-production-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          
      - name: Commit and Push APK to "apk-builds" Branch
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git checkout --orphan apk-builds  # Creates a new branch if it doesn't exist
          git rm -rf .  # Removes everything (since it's an orphan branch)
          git add android/app/build/outputs/apk/release/app-release.apk
          git commit -m "Auto-commit: Update built APK"
          git push origin apk-builds --force  # Pushes the branch to remote

        # New steps for creating a GitHub Release
      - name: Extract version and release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Extract version from the first line of RELEASE_NOTES.md
          VERSION=$(head -n 1 RELEASE_NOTES.md | sed 's/[^0-9.v]//g')
          # Get the remaining content as release notes (skipping the first line)
          RELEASE_NOTES=$(tail -n +2 RELEASE_NOTES.md)
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

