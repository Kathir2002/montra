name: 'Build Android APK'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
        
      - name: Grant execute permission to Gradlew
        run: chmod +x android/gradlew

      - name: Decode Keystore from Base64
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/montra.keystore

      - name: Verify keystore location
        run: |
          ls -la android/app/
          echo "Working directory: $(pwd)"

      - name: Build Signed APK
        run: |
          cd android
          ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=montra.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.MYAPP_RELEASE_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-production-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
